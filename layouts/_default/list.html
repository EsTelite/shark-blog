{{ define "main" }}
<header class="page-header">
  <p class="eyebrow">Collection</p>
  <h1>{{ .Title }}</h1>
</header>

<div class="post-list">
  {{ range .Pages.ByDate.Reverse }}
    {{ partial "post-card.html" . }}
  {{ else }}
    <p>There is no content here yet.</p>
  {{ end }}
</div>
{{ end }}
