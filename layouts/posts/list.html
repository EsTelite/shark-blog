{{ define "main" }}
<header class="page-header">
  <p class="eyebrow">Archive</p>
  <h1>{{ .Title }}</h1>
  <p>Notes and longer pieces from the blog.</p>
</header>

<div class="post-list">
  {{ range .Pages.ByDate.Reverse }}
    {{ partial "post-card.html" . }}
  {{ else }}
    <p>No posts have been published yet.</p>
  {{ end }}
</div>
{{ end }}
